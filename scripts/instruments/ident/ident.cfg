# (728) 恒等の証明の基準（ident.sh が読む）。合流で新しい基線を作ったら、ここを新しい基線の物へ書き換える（相対パスはリポジトリの根から）。
# 現在の基準＝基線 m702（字は m702・m711・m719・m727 で完全一致）＋計器つき 10 種は (727) の合流の物。
B5=measurements/b5_20261031_m702
B10INS=measurements/b10_20261101_m727_ins
MON=measurements/mon_20261101_m727.txt
# 計器の生（基線の計器つき 10 種）。keep_727 は合流まで消さない。無ければ計器の表は〈未了〉になる。
INSRAW=D:/PoB_work/keep_727/base_ins
# 既知の揺れ（表:列[@列=値]。これだけが違う表は〈既知の揺れ〉として別に数える）：burscan_s の seconds・clock_s の worldTotalPerMonth の C 行（秒）だけ（W/T/E 行は世界の合計＝比べる）
# flow_s は呼び出し位置（sourceFile・sourceLine）を除いた行の多重集合で比べる（ident_check.py の FLOW_LOC＝並べ替え・行の移動・別ファイルへの移動は通る・呼び出し位置の合わせ＝2 行が 1 行になるのは不一致）
KNOWN=burscan_s:seconds,clock_s:worldTotalPerMonth@kind=C
# テストの数（--list-tests）：Category!=FullLength と FullLength。測って合わなければ書き換える前に理由を読む。
TESTS_NONFULL=2104
TESTS_FULL=3
# NG の基準（--ng のとき）
NG_BASE=rd:measurements/ng702_20261031:m702
